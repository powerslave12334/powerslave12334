<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="300" fill="#0D1117"/>
  <!-- Dithered circuit pattern -->
  <g opacity="0.6">
    <!-- Horizontal lines -->
    <line x1="50" y1="80" x2="750" y2="80" stroke="#F59E0B" stroke-width="0.5" opacity="0.3"/>
    <line x1="50" y1="120" x2="750" y2="120" stroke="#F59E0B" stroke-width="0.5" opacity="0.2"/>
    <line x1="50" y1="160" x2="750" y2="160" stroke="#F59E0B" stroke-width="0.5" opacity="0.3"/>
    <line x1="50" y1="200" x2="750" y2="200" stroke="#F59E0B" stroke-width="0.5" opacity="0.2"/>
    <line x1="50" y1="240" x2="750" y2="240" stroke="#F59E0B" stroke-width="0.5" opacity="0.3"/>
    <!-- Vertical lines -->
    <line x1="100" y1="40" x2="100" y2="280" stroke="#F59E0B" stroke-width="0.5" opacity="0.2"/>
    <line x1="200" y1="40" x2="200" y2="280" stroke="#F59E0B" stroke-width="0.5" opacity="0.3"/>
    <line x1="300" y1="40" x2="300" y2="280" stroke="#F59E0B" stroke-width="0.5" opacity="0.2"/>
    <line x1="400" y1="40" x2="400" y2="280" stroke="#F59E0B" stroke-width="0.5" opacity="0.3"/>
    <line x1="500" y1="40" x2="500" y2="280" stroke="#F59E0B" stroke-width="0.5" opacity="0.2"/>
    <line x1="600" y1="40" x2="600" y2="280" stroke="#F59E0B" stroke-width="0.5" opacity="0.3"/>
    <line x1="700" y1="40" x2="700" y2="280" stroke="#F59E0B" stroke-width="0.5" opacity="0.2"/>
  </g>
  <!-- Circuit nodes -->
  <g filter="url(#glow)">
    <circle cx="100" cy="80" r="4" fill="#F59E0B" opacity="0.8"><animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="120" r="3" fill="#D97706" opacity="0.6"/>
    <circle cx="300" cy="80" r="5" fill="#F59E0B" opacity="0.9"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="160" r="4" fill="#F59E0B" opacity="0.7"/>
    <circle cx="500" cy="120" r="3" fill="#D97706" opacity="0.5"/>
    <circle cx="600" cy="80" r="6" fill="#F59E0B" opacity="1"><animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="160" r="4" fill="#F59E0B" opacity="0.7"/>
    <circle cx="150" cy="200" r="3" fill="#D97706" opacity="0.6"/>
    <circle cx="250" cy="240" r="4" fill="#F59E0B" opacity="0.8"/>
    <circle cx="350" cy="200" r="5" fill="#F59E0B" opacity="0.9"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="240" r="3" fill="#D97706" opacity="0.5"/>
    <circle cx="550" cy="200" r="4" fill="#F59E0B" opacity="0.7"/>
    <circle cx="650" cy="240" r="5" fill="#F59E0B" opacity="0.8"><animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <!-- Connection paths -->
  <g stroke="#F59E0B" stroke-width="1" fill="none" opacity="0.4">
    <path d="M100 80 L200 120 L300 80"/>
    <path d="M300 80 L400 160 L500 120"/>
    <path d="M500 120 L600 80 L700 160"/>
    <path d="M150 200 L250 240 L350 200"/>
    <path d="M350 200 L450 240 L550 200"/>
    <path d="M550 200 L650 240"/>
    <path d="M200 120 L250 240"/>
    <path d="M400 160 L450 240"/>
    <path d="M600 80 L650 240"/>
  </g>
  <!-- Central text -->
  <text x="400" y="150" text-anchor="middle" fill="#F59E0B" font-family="'Courier New',monospace" font-size="14" opacity="0.8" filter="url(#glow)">
    <tspan x="400" dy="0">ALAN GUZMAN</tspan>
    <tspan x="400" dy="20" font-size="11" fill="#6B7280">DEVELOPER // SYSTEMS ADMINISTRATOR</tspan>
  </text>
  <!-- Dithered pixel overlay -->
  <g opacity="0.15">
    <rect x="120" y="90" width="4" height="4" fill="#F59E0B"/>
    <rect x="180" y="130" width="4" height="4" fill="#F59E0B"/>
    <rect x="240" y="70" width="4" height="4" fill="#F59E0B"/>
    <rect x="320" y="110" width="4" height="4" fill="#F59E0B"/>
    <rect x="380" y="150" width="4" height="4" fill="#F59E0B"/>
    <rect x="440" y="90" width="4" height="4" fill="#F59E0B"/>
    <rect x="520" y="130" width="4" height="4" fill="#F59E0B"/>
    <rect x="580" y="70" width="4" height="4" fill="#F59E0B"/>
    <rect x="660" y="110" width="4" height="4" fill="#F59E0B"/>
    <rect x="720" y="150" width="4" height="4" fill="#F59E0B"/>
    <rect x="140" y="190" width="4" height="4" fill="#D97706"/>
    <rect x="220" y="230" width="4" height="4" fill="#D97706"/>
    <rect x="340" y="190" width="4" height="4" fill="#D97706"/>
    <rect x="420" y="230" width="4" height="4" fill="#D97706"/>
    <rect x="540" y="190" width="4" height="4" fill="#D97706"/>
    <rect x="620" y="230" width="4" height="4" fill="#D97706"/>
    <rect x="160" y="110" width="3" height="3" fill="#F59E0B" opacity="0.5"/>
    <rect x="280" y="150" width="3" height="3" fill="#F59E0B" opacity="0.5"/>
    <rect x="460" y="110" width="3" height="3" fill="#F59E0B" opacity="0.5"/>
    <rect x="560" y="150" width="3" height="3" fill="#F59E0B" opacity="0.5"/>
    <rect x="680" y="110" width="3" height="3" fill="#F59E0B" opacity="0.5"/>
    <rect x="190" y="210" width="3" height="3" fill="#D97706" opacity="0.5"/>
    <rect x="310" y="250" width="3" height="3" fill="#D97706" opacity="0.5"/>
    <rect x="490" y="210" width="3" height="3" fill="#D97706" opacity="0.5"/>
    <rect x="610" y="250" width="3" height="3" fill="#D97706" opacity="0.5"/>
  </g>
</svg>
